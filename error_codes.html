  <script>
    const APP_VERSION = '202608231759';
    const CACHE_PREFIX = 'eps-work-planner-v';
    const SW_URL = `./sw.js?v=${APP_VERSION}`;
    const IS_LOCALHOST = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
    const CAN_LOAD_MANIFEST = location.protocol === 'http:' || location.protocol === 'https:';
    const CAN_USE_SERVICE_WORKER = location.protocol === 'https:' || IS_LOCALHOST;

    if (CAN_LOAD_MANIFEST) {
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = 'manifest.json';
      document.head.appendChild(manifestLink);
    }

    if (CAN_USE_SERVICE_WORKER && 'caches' in window) {
      const savedVersion = localStorage.getItem('eps-app-version');
      const alreadyRefreshed = sessionStorage.getItem('eps-version-refreshed');

      if (savedVersion !== APP_VERSION && !alreadyRefreshed) {
        caches.keys()
          .then((names) => Promise.all(
            names
              .filter((name) => name.startsWith(CACHE_PREFIX) && name !== `${CACHE_PREFIX}${APP_VERSION}`)
              .map((name) => caches.delete(name))
          ))
          .finally(() => {
            localStorage.setItem('eps-app-version', APP_VERSION);
            sessionStorage.setItem('eps-version-refreshed', 'yes');
            window.location.reload();
          });
      }
    }

    if (CAN_USE_SERVICE_WORKER && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(SW_URL).catch((error) => {
          console.error('Service worker registration failed:', error);
        });
      });
    }
  </script>

  <style>
    /* ── Page Layout ── */
    .error-page {
      padding-bottom: calc(var(--nav-height) + var(--space-8));
      max-width: 640px;
    }

    /* ── Search Panel ── */
    .search-panel {
      display: grid;
      gap: var(--space-3);
    }

    .search-field {
      align-items: center;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--surface-2) 58%, transparent), transparent),
        var(--surface-1);
      border: 1.5px solid var(--surface-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      display: flex;
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      gap: var(--space-2);
      min-height: 56px;
      min-width: 0;
      padding: var(--space-3);
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      width: 100%;
    }

    .search-field::before {
      background: var(--surface-1);
      color: var(--text-muted);
      content: "diagnostic console";
      font-size: 10px;
      font-weight: 700;
      left: var(--space-3);
      letter-spacing: 0.03em;
      line-height: 1;
      padding: 0 var(--space-2);
      position: absolute;
      text-transform: uppercase;
      top: -6px;
    }

    .search-field:focus-within {
      border-color: var(--primary-color);
      box-shadow: var(--shadow-focus);
    }

    .console-prompt {
      color: var(--success-color, var(--primary-color));
      font-weight: 800;
      line-height: 1;
      margin-left: var(--space-1);
    }

    .console-command {
      color: var(--primary-color);
      font-weight: 800;
      line-height: 1;
    }

    .console-cursor {
      background: color-mix(in srgb, var(--primary-color) 70%, var(--text-color));
      display: inline-block;
      flex-shrink: 0;
      height: 18px;
      opacity: 0.72;
      width: 2px;
    }

    .search-input {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: var(--font-size-base);
      font-weight: 700;
      letter-spacing: 0.02em;
      min-width: 0;
      outline: none;
      padding: 0;
      text-transform: uppercase;
      width: 100%;
    }

    .search-input::placeholder {
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
    }

    .clear-icon-btn {
      align-items: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      height: 100%;
      justify-content: center;
      width: 34px;
      flex-shrink: 0;
    }

    .clear-icon-btn:hover {
      color: var(--text-color);
    }

    .search-button {
      align-items: center;
      background: color-mix(in srgb, var(--success-color, var(--primary-color)) 15%, var(--surface-1));
      border: 1px solid color-mix(in srgb, var(--success-color, var(--primary-color)) 42%, var(--surface-border));
      border-radius: var(--radius-sm);
      color: var(--success-color, var(--primary-color));
      cursor: pointer;
      display: flex;
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 18px;
      font-weight: 800;
      height: 34px;
      justify-content: center;
      line-height: 1;
      min-width: 38px;
      padding: 0;
      transition: background 0.2s, border-color 0.2s, transform 0.15s, opacity 0.2s;
      width: 38px;
      flex-shrink: 0;
    }

    .search-button:hover:not(:disabled) {
      background: var(--success-color, var(--primary-color));
      border-color: var(--success-color, var(--primary-color));
      color: var(--primary-text);
      transform: scale(1.06);
    }

    .search-button:active:not(:disabled) {
      transform: scale(0.95);
    }

    .search-button:focus-visible {
      outline: none;
      box-shadow: var(--shadow-focus);
    }

    .search-button:disabled {
      animation: send-pulse 0.75s ease-in-out infinite alternate;
      cursor: wait;
      opacity: 0.7;
    }

    @keyframes send-pulse {
      from { transform: translateX(0) scale(1); opacity: 0.6; }
      to { transform: translateX(3px) scale(1.08); opacity: 1; }
    }

    /* ── Status Line ── */
    .status-line {
      color: var(--text-secondary);
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: var(--font-size-sm);
      min-height: 22px;
      padding-left: var(--space-2);
    }

    .status-key {
      color: var(--primary-color);
      font-weight: 800;
    }

    .status-value {
      color: var(--text-secondary);
      font-weight: 700;
    }

    .status-value.searching {
      animation: searching-glow 0.95s ease-in-out infinite alternate;
      color: var(--success-color, var(--primary-color));
      display: inline-block;
      min-width: 10ch;
    }

    .status-value.searching::after {
      animation: searching-dots 1.15s steps(4, end) infinite;
      content: "";
      display: inline-block;
      text-align: left;
      width: 3ch;
    }

    @keyframes searching-glow {
      from {
        opacity: 0.62;
        text-shadow: 0 0 0 transparent;
      }
      to {
        opacity: 1;
        text-shadow: 0 0 12px color-mix(in srgb, var(--success-color, var(--primary-color)) 42%, transparent);
      }
    }

    @keyframes searching-dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%,
      100% { content: "..."; }
    }

    /* ── Results Container ── */
    .results {
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--surface-2) 52%, transparent), transparent),
        var(--surface-1);
      border: 1.5px solid var(--surface-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      display: grid;
      gap: var(--space-3);
      margin-top: var(--space-2);
      padding: var(--space-4);
      position: relative;
    }

    .results::before {
      background: var(--surface-1);
      color: var(--text-muted);
      content: "output";
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      left: var(--space-3);
      letter-spacing: 0.03em;
      line-height: 1;
      padding: 0 var(--space-2);
      position: absolute;
      text-transform: uppercase;
      top: -6px;
    }

    /* ── Accordion Card ── */
    .acc-card {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .acc-card:hover {
      box-shadow: var(--shadow-md, var(--shadow-sm));
    }

    .acc-header {
      align-items: center;
      background: transparent;
      border: none;
      color: inherit;
      cursor: pointer;
      display: flex;
      font-family: inherit;
      gap: var(--space-3);
      padding: var(--space-4);
      text-align: left;
      width: 100%;
      transition: background 0.15s;
    }

    .acc-header:hover {
      background: var(--surface-2);
    }

    .acc-chevron {
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .acc-card.open .acc-chevron {
      transform: rotate(90deg);
    }

    .acc-code {
      color: var(--primary-color);
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: clamp(18px, 5vw, 24px);
      font-weight: 800;
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }

    .badge {
      border-radius: var(--radius-full);
      background: var(--surface-2);
      border: 1px solid var(--surface-border);
      color: var(--text-secondary);
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge.exact {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color: var(--primary-text);
    }

    /* ── Accordion Body ── */
    .acc-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s ease;
    }

    .acc-card.open .acc-body {
      grid-template-rows: 1fr;
    }

    .acc-body-inner {
      overflow: hidden;
    }

    .acc-content {
      border-top: 1px solid var(--surface-border);
      display: grid;
      gap: 0;
      padding: 0;
    }

    /* ── Section Items ── */
    .sec-item {
      padding: var(--space-3) var(--space-4);
    }

    .sec-item + .sec-item {
      border-top: 1px solid color-mix(in srgb, var(--surface-border) 50%, transparent);
    }

    .sec-label {
      align-items: center;
      color: var(--text-secondary);
      display: flex;
      font-size: var(--font-size-xs);
      font-weight: 600;
      gap: var(--space-2);
      margin-bottom: var(--space-1);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .sec-emoji {
      font-size: 14px;
      line-height: 1;
    }

    .sec-text {
      color: var(--text-color);
      font-size: 13.5px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .sec-item.highlight {
      background: color-mix(in srgb, var(--primary-color) 5%, var(--surface-1));
    }

    /* ── Card Meta ── */
    .acc-meta {
      border-top: 1px solid var(--surface-border);
      padding: var(--space-2) var(--space-4);
      background: var(--surface-2);
    }

    .acc-meta-text {
      color: var(--text-muted);
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.02em;
    }

    /* ── Empty State ── */
    .empty-state {
      color: var(--text-secondary);
      display: grid;
      gap: var(--space-2);
      padding: var(--space-6) 0;
      text-align: left;
    }

    .terminal-line {
      color: var(--text-muted);
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .terminal-key {
      color: var(--primary-color);
      font-weight: 800;
    }

    .terminal-string {
      color: var(--success-color, var(--primary-color));
      font-weight: 700;
    }

    .terminal-null {
      color: var(--text-secondary);
      font-weight: 700;
    }

    /* ── Config Warning ── */
    .config-warning {
      background: var(--status-pending-bg, var(--surface-2));
      color: var(--status-pending-text, var(--text-color));
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      font-size: var(--font-size-sm);
      display: none;
    }

    /* ── Theme Modal ── */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-3);
    }

    .theme-option {
      background: var(--surface-2);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      cursor: pointer;
      transition: var(--transition-base);
    }

    .theme-option:hover {
      background: var(--surface-3);
      transform: translateY(-2px);
    }

    .theme-preview {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px var(--surface-border);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: var(--z-modal);
      padding: var(--space-4);
    }

    .modal-content {
      background: var(--bg-color);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
    }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      .error-page {
        padding-left: var(--space-3);
        padding-right: var(--space-3);
      }
    }

    /* ── Card Appear Animation ── */
    @keyframes card-appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .acc-card {
      animation: card-appear 0.3s ease both;
    }

    .acc-card:nth-child(2) { animation-delay: 0.06s; }
    .acc-card:nth-child(3) { animation-delay: 0.12s; }
    .acc-card:nth-child(4) { animation-delay: 0.18s; }
    .acc-card:nth-child(5) { animation-delay: 0.24s; }
  </style>
</head>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    function openThemeModal() {
      document.getElementById('themeModal').style.display = 'flex';
    }

    function closeThemeModal() {
      document.getElementById('themeModal').style.display = 'none';
    }

    function selectTheme(themeId) {
      setGlobalTheme(themeId);
      closeThemeModal();
    }

    const firebaseConfig = {
      apiKey: "AIzaSyAqqwSS1KTnAjfGcqvV_-TRHMYXJlTjtlI",
      authDomain: "catatan-troubleshoot-atm-2b5a4.firebaseapp.com",
      databaseURL: "https://catatan-troubleshoot-atm-2b5a4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "catatan-troubleshoot-atm-2b5a4",
      storageBucket: "catatan-troubleshoot-atm-2b5a4.firebasestorage.app",
      messagingSenderId: "441198643571",
      appId: "1:441198643571:web:7ee3c056d933acb3515d06"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const errorCodesRef = db.ref('error_codes');
    const resultsEl = document.getElementById('results');
    const statusEl = document.getElementById('statusLine');
    const queryInput = document.getElementById('queryInput');
    const searchButton = document.getElementById('searchButton');
    const clearButton = document.getElementById('clearButton');
    const configWarning = document.getElementById('configWarning');
    let cachedRecords = null;
    let localSearchIndex = null;
    let cacheLoadPromise = null;
    let fullDataNetworkPromise = null;
    let browserCacheMeta = null;
    let backgroundRefreshScheduled = false;
    let hasCompletedSearch = false;
    const BROWSER_CACHE_DB = 'eps-error-code-cache';
    const BROWSER_CACHE_STORE = 'snapshots';
    const BROWSER_CACHE_KEY = 'error_codes';
    const BROWSER_CACHE_TTL_MS = 12 * 60 * 60 * 1000;
    const SEARCH_CACHE_LIMIT = 80;
    const searchResultCache = new Map();

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[char]);
    }

    function normalizeQuery(value) {
      return value.trim().toUpperCase();
    }

    function staticPrefix(value) {
      return value.replace(/X+$/i, '').toUpperCase();
    }

    function compactCode(value) {
      return String(value || '').toUpperCase().replace(/[^A-Z0-9X]/g, '');
    }

    function prefixCandidates(value) {
      const compact = compactCode(value);
      const prefixes = [];

      for (let index = 1; index <= compact.length; index += 1) {
        prefixes.push(compact.slice(0, index).replace(/X+$/i, ''));
      }

      prefixes.push(staticPrefix(compact));
      return [...new Set(prefixes.filter((prefix) => prefix.length >= 2))];
    }

    function isCodeLike(value) {
      return /^[A-Z0-9X.\-_\s]{2,}$/.test(value) && /\d/.test(value);
    }

    function snapshotToRecords(snapshot) {
      const value = snapshot.val();
      if (!value) return [];
      return Object.values(value);
    }

    function buildLocalSearchIndex(records) {
      return records.map((record) => {
        const code = (record.error_code_pattern || '').toUpperCase();
        const compactRecordCode = compactCode(code);

        return {
          record,
          code,
          compactCode: compactRecordCode,
          prefix: compactCode(record.pattern_static_prefix || staticPrefix(compactRecordCode))
        };
      });
    }

    function indexedRecordsFor(records) {
      if (records === cachedRecords) {
        if (!localSearchIndex) localSearchIndex = buildLocalSearchIndex(records);
        return localSearchIndex;
      }

      return buildLocalSearchIndex(records);
    }

    function setCachedRecords(records, meta) {
      cachedRecords = records;
      localSearchIndex = buildLocalSearchIndex(records);
      browserCacheMeta = meta;
      searchResultCache.clear();
    }

    function openErrorCodeCacheDb() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('IndexedDB is not available.'));
          return;
        }

        const request = indexedDB.open(BROWSER_CACHE_DB, 1);

        request.onupgradeneeded = () => {
          const database = request.result;
          if (!database.objectStoreNames.contains(BROWSER_CACHE_STORE)) {
            database.createObjectStore(BROWSER_CACHE_STORE, { keyPath: 'key' });
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Failed to open error code cache.'));
      });
    }

    async function readRecordsFromBrowserCache() {
      const database = await openErrorCodeCacheDb();

      return new Promise((resolve, reject) => {
        const transaction = database.transaction(BROWSER_CACHE_STORE, 'readonly');
        const store = transaction.objectStore(BROWSER_CACHE_STORE);
        const request = store.get(BROWSER_CACHE_KEY);

        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error || new Error('Failed to read error code cache.'));
        transaction.oncomplete = () => database.close();
        transaction.onerror = () => reject(transaction.error || new Error('Failed to read error code cache.'));
      });
    }

    async function writeRecordsToBrowserCache(records) {
      const database = await openErrorCodeCacheDb();

      return new Promise((resolve, reject) => {
        const transaction = database.transaction(BROWSER_CACHE_STORE, 'readwrite');
        const store = transaction.objectStore(BROWSER_CACHE_STORE);
        const savedAt = Date.now();
        const request = store.put({
          key: BROWSER_CACHE_KEY,
          records,
          savedAt,
          version: APP_VERSION
        });

        request.onsuccess = () => resolve({ savedAt, version: APP_VERSION });
        request.onerror = () => reject(request.error || new Error('Failed to write error code cache.'));
        transaction.oncomplete = () => database.close();
        transaction.onerror = () => reject(transaction.error || new Error('Failed to write error code cache.'));
      });
    }

    function isBrowserCacheFresh(meta) {
      return Boolean(
        meta &&
        meta.version === APP_VERSION &&
        meta.savedAt &&
        Date.now() - meta.savedAt < BROWSER_CACHE_TTL_MS
      );
    }

    function rememberSearchResult(term, rows) {
      if (searchResultCache.has(term)) searchResultCache.delete(term);
      searchResultCache.set(term, rows);

      if (searchResultCache.size > SEARCH_CACHE_LIMIT) {
        searchResultCache.delete(searchResultCache.keys().next().value);
      }
    }

    function uniqueRecords(records) {
      const map = new Map();
      records.forEach((record) => {
        const id = record.source_record_id ?? record.record_id ?? record.error_code_pattern;
        if (!map.has(id)) map.set(id, record);
      });
      return [...map.values()];
    }

    function sortRecords(term, records) {
      const compactTerm = compactCode(term);

      return records.sort((a, b) => {
        const aCode = (a.error_code_pattern || '').toUpperCase();
        const bCode = (b.error_code_pattern || '').toUpperCase();
        const aExact = aCode === term || compactCode(aCode) === compactTerm ? 0 : 1;
        const bExact = bCode === term || compactCode(bCode) === compactTerm ? 0 : 1;
        if (aExact !== bExact) return aExact - bExact;
        if ((b.prefix_length || 0) !== (a.prefix_length || 0)) return (b.prefix_length || 0) - (a.prefix_length || 0);
        return aCode.localeCompare(bCode);
      });
    }

    function filterCodeMatches(term, records) {
      const compactTerm = compactCode(term);

      return indexedRecordsFor(records)
        .filter((entry) => entry.code === term ||
          entry.code.startsWith(term) ||
          entry.compactCode === compactTerm ||
          entry.compactCode.startsWith(compactTerm) ||
          (entry.record.is_pattern && entry.prefix && compactTerm.startsWith(entry.prefix)))
        .map((entry) => entry.record);
    }

    async function queryCodeMatches(term) {
      const compactTerm = compactCode(term);
      const queries = [
        errorCodesRef.orderByChild('error_code_pattern').equalTo(term).once('value'),
        errorCodesRef.orderByChild('error_code_pattern').startAt(term).endAt(`${term}\uf8ff`).limitToFirst(200).once('value')
      ];

      if (compactTerm && compactTerm !== term) {
        queries.push(
          errorCodesRef.orderByChild('error_code_pattern').equalTo(compactTerm).once('value'),
          errorCodesRef.orderByChild('error_code_pattern').startAt(compactTerm).endAt(`${compactTerm}\uf8ff`).limitToFirst(200).once('value')
        );
      }

      prefixCandidates(term).forEach((prefix) => {
        queries.push(errorCodesRef.orderByChild('pattern_static_prefix').equalTo(prefix).once('value'));
      });

      const snapshots = await Promise.all(queries);
      return filterCodeMatches(term, uniqueRecords(snapshots.flatMap(snapshotToRecords)));
    }

    async function refreshAllRecords({ silent = false } = {}) {
      if (fullDataNetworkPromise) return fullDataNetworkPromise;

      fullDataNetworkPromise = (async () => {
        if (!silent) statusEl.textContent = 'status: refreshing_cache';
        const snapshot = await errorCodesRef.once('value');
        const records = snapshotToRecords(snapshot);
        const meta = { savedAt: Date.now(), version: APP_VERSION };
        setCachedRecords(records, meta);

        writeRecordsToBrowserCache(records)
          .then((meta) => {
            browserCacheMeta = meta;
          })
          .catch((error) => {
            console.warn('Failed to save error code cache:', error);
          });

        if (!records.length) {
          configWarning.style.display = 'block';
        }

        return records;
      })().finally(() => {
        fullDataNetworkPromise = null;
      });

      return fullDataNetworkPromise;
    }

    async function loadAllRecords({ preferCache = true } = {}) {
      if (cachedRecords) return cachedRecords;
      if (cacheLoadPromise) return cacheLoadPromise;

      cacheLoadPromise = (async () => {
        if (preferCache) {
          try {
            const cached = await readRecordsFromBrowserCache();
            const meta = cached ? { savedAt: cached.savedAt, version: cached.version } : null;

            if (cached && Array.isArray(cached.records) && cached.records.length && isBrowserCacheFresh(meta)) {
              setCachedRecords(cached.records, meta);
              return cachedRecords;
            }
          } catch (error) {
            console.warn('Failed to load error code cache:', error);
          }
        }

        return refreshAllRecords();
      })().finally(() => {
        cacheLoadPromise = null;
      });

      return cacheLoadPromise;
    }

    function scheduleBackgroundRefresh() {
      if (!hasCompletedSearch || backgroundRefreshScheduled || fullDataNetworkPromise) return;
      if (cachedRecords && isBrowserCacheFresh(browserCacheMeta)) return;

      backgroundRefreshScheduled = true;

      const refresh = () => {
        backgroundRefreshScheduled = false;
        refreshAllRecords({ silent: true }).catch((error) => {
          console.warn('Failed to refresh error code cache:', error);
        });
      };

      window.setTimeout(() => {
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(refresh, { timeout: 5000 });
        } else {
          window.setTimeout(refresh, 1200);
        }
      }, 600);
    }

    async function warmErrorCodeCache() {
      try {
        const cached = await readRecordsFromBrowserCache();
        const meta = cached ? { savedAt: cached.savedAt, version: cached.version } : null;

        if (cached && Array.isArray(cached.records) && cached.records.length && isBrowserCacheFresh(meta)) {
          setCachedRecords(cached.records, meta);
          if (!queryInput.value.trim()) {
            statusEl.textContent = `status: ready · records: ${cachedRecords.length}`;
          }
        }
      } catch (error) {
        console.warn('Failed to warm error code cache:', error);
      }
    }

    function isMissingIndexError(error) {
      return String(error && error.message ? error.message : error).toLowerCase().includes('index not defined');
    }

    /* ── Toggle accordion ── */
    function toggleCard(button) {
      const card = button.closest('.acc-card');
      card.classList.toggle('open');
    }

    /* ── Quick search from hint chips ── */
    function quickSearch(el) {
      queryInput.value = el.textContent.trim();
      search();
    }

    /* ── Build section HTML ── */
    function section(emoji, label, text, highlight) {
      const value = text || '-';
      return `
        <div class="sec-item${highlight ? ' highlight' : ''}">
          <div class="sec-label">
            <span class="sec-emoji">${emoji}</span>
            ${escapeHtml(label)}
          </div>
          <div class="sec-text">${escapeHtml(value)}</div>
        </div>`;
    }

    /* ── Card renderer (Accordion) ── */
    function card(record, index) {
      const code = record.error_code_pattern || '';
      const type = record.is_pattern || code.includes('X') ? 'Pattern' : 'Exact';
      const isExact = type === 'Exact';
      const openClass = index === 0 ? ' open' : '';
      const serviceRecovery = record.service_recovery_all || record.service_recovery || '';
      const meta = [
        `ID:${record.source_record_id ?? record.record_id ?? '-'}`,
        `PFX:${record.pattern_static_prefix || '-'}`,
        `LEN:${record.prefix_length ?? '-'}`,
        `REC:${record.service_recovery_count ?? 0}`
      ].join(' · ');

      return `
        <article class="acc-card${openClass}">
          <button class="acc-header" type="button" onclick="toggleCard(this)" aria-expanded="${index === 0}">
            <svg class="acc-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
            <span class="acc-code">${escapeHtml(code)}</span>
            <span class="badge ${type.toLowerCase()}">${type}</span>
          </button>
          <div class="acc-body">
            <div class="acc-body-inner">
              <div class="acc-content">
                ${section('📋', 'Operator Cause', record.operator_cause, true)}
                ${section('✅', 'Operator Recovery', record.operator_recovery, true)}
                ${section('🔧', 'Service Cause', record.service_cause, false)}
                ${section('🛠️', 'Service Recovery', record.service_recovery, false)}
                ${section('📑', 'Service Recovery All', serviceRecovery, false)}
                ${section('🆔', 'Errguid Record IDs', record.errguid_record_ids, false)}
              </div>
              <div class="acc-meta">
                <div class="acc-meta-text">${escapeHtml(meta)}</div>
              </div>
            </div>
          </div>
        </article>`;
    }

    function renderEmpty(message, isNotFound) {
      const status = isNotFound ? 'not_found' : 'waiting_for_input';
      const result = isNotFound ? '[]' : 'null';
      const messageText = message || (isNotFound ? 'Error code tidak ditemukan. Pastikan kode yang dimasukkan benar.' : '');
      const messageMarkup = messageText
        ? `<div class="terminal-line"><span class="terminal-key">message</span>: <span class="terminal-string">"${escapeHtml(messageText)}"</span></div>`
        : '';

      resultsEl.innerHTML = `
        <div class="empty-state">
          <div class="terminal-line"><span class="terminal-key">status</span>: <span class="terminal-string">${status}</span></div>
          <div class="terminal-line"><span class="terminal-key">result</span>: <span class="terminal-null">${result}</span></div>
          ${messageMarkup}
        </div>`;
    }

    function renderSearchResults(term, rows, source) {
      searchButton.disabled = false;
      searchButton.setAttribute('aria-label', 'Search');
      statusEl.textContent = `status: found · results: ${rows.length}${rows.length === 200 ? ' · limit: 200' : ''}${source ? ` · source: ${source}` : ''}`;
      resultsEl.innerHTML = rows.length ? rows.map((record, i) => card(record, i)).join('') : '';
      if (!rows.length) renderEmpty('', true);
      hasCompletedSearch = true;
      scheduleBackgroundRefresh();
    }

    async function search() {
      const term = normalizeQuery(queryInput.value);
      if (!term) {
        statusEl.textContent = 'status: waiting_for_input';
        renderEmpty('', false);
        return;
      }

      searchButton.disabled = true;
      searchButton.setAttribute('aria-label', 'Searching');
      statusEl.innerHTML = '<span class="status-key">status</span>: <span class="status-value searching">searching</span>';

      try {
        const cachedRows = searchResultCache.get(term);
        if (cachedRows) {
          renderSearchResults(term, cachedRows, 'cached');
          return;
        }

        const termIsCodeLike = isCodeLike(term);
        if (!termIsCodeLike) {
          searchButton.disabled = false;
          searchButton.setAttribute('aria-label', 'Search');
          statusEl.textContent = 'status: invalid_input';
          renderEmpty('Input harus berupa error code.', true);
          return;
        }

        let codeMatches = [];
        let resultSource = '';

        if (cachedRecords) {
          codeMatches = filterCodeMatches(term, cachedRecords);
          resultSource = 'local cache';
        } else {
          try {
            codeMatches = await queryCodeMatches(term);
          } catch (error) {
            if (!isMissingIndexError(error)) throw error;
            configWarning.style.display = 'block';
            configWarning.textContent = 'Firebase index belum dipasang. Search error code tetap berjalan dengan fallback data penuh.';
            const records = await loadAllRecords();
            codeMatches = filterCodeMatches(term, records);
            resultSource = 'full data';
          }
        }

        const rows = sortRecords(term, uniqueRecords(codeMatches)).slice(0, 200);
        rememberSearchResult(term, rows);

        renderSearchResults(term, rows, resultSource);
      } catch (error) {
        console.error(error);
        searchButton.disabled = false;
        searchButton.setAttribute('aria-label', 'Search');
        statusEl.textContent = 'status: search_failed';
        renderEmpty(error.message || 'Gagal mengambil data dari Firebase.', true);
      }
    }

    errorCodesRef.limitToFirst(1).once('value')
      .then((snapshot) => {
        if (!snapshot.exists()) {
          configWarning.style.display = 'block';
        }
      })
      .catch((error) => {
        console.error(error);
        configWarning.style.display = 'block';
        statusEl.textContent = 'status: firebase_failed';
      });

    setTimeout(warmErrorCodeCache, 350);

    function clearSearch() {
      queryInput.value = '';
      statusEl.textContent = 'status: waiting_for_input';
      renderEmpty('', false);
      queryInput.focus();
    }

    searchButton.addEventListener('click', search);
    clearButton.addEventListener('click', clearSearch);
    queryInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') search();
    });
  </script>
