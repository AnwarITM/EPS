  <script>
    const APP_VERSION = '202608212329';
    const CACHE_PREFIX = 'eps-work-planner-v';
    const SW_URL = `./sw.js?v=${APP_VERSION}`;
    const IS_LOCALHOST = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
    const CAN_LOAD_MANIFEST = location.protocol === 'http:' || location.protocol === 'https:';
    const CAN_USE_SERVICE_WORKER = location.protocol === 'https:' || IS_LOCALHOST;

    if (CAN_LOAD_MANIFEST) {
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = 'manifest.json';
      document.head.appendChild(manifestLink);
    }

    if (CAN_USE_SERVICE_WORKER && 'caches' in window) {
      const savedVersion = localStorage.getItem('eps-app-version');
      const alreadyRefreshed = sessionStorage.getItem('eps-version-refreshed');

      if (savedVersion !== APP_VERSION && !alreadyRefreshed) {
        caches.keys()
          .then((names) => Promise.all(
            names
              .filter((name) => name.startsWith(CACHE_PREFIX) && name !== `${CACHE_PREFIX}${APP_VERSION}`)
              .map((name) => caches.delete(name))
          ))
          .finally(() => {
            localStorage.setItem('eps-app-version', APP_VERSION);
            sessionStorage.setItem('eps-version-refreshed', 'yes');
            window.location.reload();
          });
      }
    }

    if (CAN_USE_SERVICE_WORKER && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(SW_URL).catch((error) => {
          console.error('Service worker registration failed:', error);
        });
      });
    }
  </script>

  <script>
    function openThemeModal() {
      document.getElementById('themeModal').style.display = 'flex';
    }

    function closeThemeModal() {
      document.getElementById('themeModal').style.display = 'none';
    }

    function selectTheme(themeId) {
      setGlobalTheme(themeId);
      closeThemeModal();
    }

    const firebaseConfig = {
      apiKey: "AIzaSyAqqwSS1KTnAjfGcqvV_-TRHMYXJlTjtlI",
      authDomain: "catatan-troubleshoot-atm-2b5a4.firebaseapp.com",
      databaseURL: "https://catatan-troubleshoot-atm-2b5a4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "catatan-troubleshoot-atm-2b5a4",
      storageBucket: "catatan-troubleshoot-atm-2b5a4.firebasestorage.app",
      messagingSenderId: "441198643571",
      appId: "1:441198643571:web:7ee3c056d933acb3515d06"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const errorCodesRef = db.ref('error_codes');
    const resultsEl = document.getElementById('results');
    const statusEl = document.getElementById('statusLine');
    const queryInput = document.getElementById('queryInput');
    const searchButton = document.getElementById('searchButton');
    const clearButton = document.getElementById('clearButton');
    const configWarning = document.getElementById('configWarning');
    let cachedRecords = null;

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[char]);
    }

    function normalizeQuery(value) {
      return value.trim().toUpperCase();
    }

    function staticPrefix(value) {
      return value.replace(/X+$/i, '').toUpperCase();
    }

    function prefixCandidates(value) {
      const compact = value.replace(/[^A-Z0-9X]/g, '');
      const prefixes = [];

      for (let index = 1; index <= compact.length; index += 1) {
        prefixes.push(compact.slice(0, index).replace(/X+$/i, ''));
      }

      prefixes.push(staticPrefix(compact));
      return [...new Set(prefixes.filter(Boolean))];
    }

    function isCodeLike(value) {
      return /^[A-Z0-9X]{2,}$/.test(value);
    }

    function snapshotToRecords(snapshot) {
      const value = snapshot.val();
      if (!value) return [];
      return Object.values(value);
    }

    function uniqueRecords(records) {
      const map = new Map();
      records.forEach((record) => {
        const id = record.source_record_id ?? record.record_id ?? record.error_code_pattern;
        if (!map.has(id)) map.set(id, record);
      });
      return [...map.values()];
    }

    function sortRecords(term, records) {
      return records.sort((a, b) => {
        const aCode = (a.error_code_pattern || '').toUpperCase();
        const bCode = (b.error_code_pattern || '').toUpperCase();
        const aExact = aCode === term ? 0 : 1;
        const bExact = bCode === term ? 0 : 1;
        if (aExact !== bExact) return aExact - bExact;
        if ((b.prefix_length || 0) !== (a.prefix_length || 0)) return (b.prefix_length || 0) - (a.prefix_length || 0);
        return aCode.localeCompare(bCode);
      });
    }

    async function queryCodeMatches(term) {
      const queries = [
        errorCodesRef.orderByChild('error_code_pattern').equalTo(term).once('value'),
        errorCodesRef.orderByChild('error_code_pattern').startAt(term).endAt(`${term}\uf8ff`).limitToFirst(200).once('value')
      ];

      prefixCandidates(term).forEach((prefix) => {
        queries.push(errorCodesRef.orderByChild('pattern_static_prefix').equalTo(prefix).once('value'));
      });

      const snapshots = await Promise.all(queries);
      return uniqueRecords(snapshots.flatMap(snapshotToRecords)).filter((record) => {
        const code = (record.error_code_pattern || '').toUpperCase();
        const prefix = (record.pattern_static_prefix || staticPrefix(code)).toUpperCase();
        return code === term ||
          code.startsWith(term) ||
          (record.is_pattern && prefix && term.startsWith(prefix));
      });
    }

    async function loadAllRecords() {
      if (cachedRecords) return cachedRecords;
      statusEl.textContent = 'Loading keyword index...';
      const snapshot = await errorCodesRef.once('value');
      cachedRecords = snapshotToRecords(snapshot);
      if (!cachedRecords.length) {
        configWarning.style.display = 'block';
      }
      return cachedRecords;
    }

    async function queryKeywordMatches(term) {
      const records = await loadAllRecords();
      return records.filter((record) => {
        const haystack = [
          record.error_code_pattern,
          record.operator_cause,
          record.operator_recovery,
          record.service_cause,
          record.service_recovery,
          record.service_recovery_all,
          record.search_text
        ].join(' ').toUpperCase();
        return haystack.includes(term);
      });
    }

    function isMissingIndexError(error) {
      return String(error && error.message ? error.message : error).toLowerCase().includes('index not defined');
    }

    function card(record) {
      const code = record.error_code_pattern || '';
      const type = record.is_pattern || code.includes('X') ? 'Pattern' : 'Exact';
      const serviceRecovery = record.service_recovery_all || record.service_recovery || '';
      const meta = [
        `ID: ${record.source_record_id ?? record.record_id ?? '-'}`,
        `PREFIX: ${record.pattern_static_prefix || '-'}`,
        `LEN: ${record.prefix_length ?? '-'}`,
        `RECOVERY: ${record.service_recovery_count ?? 0}`
      ].join(' / ');

      return `
        <article class="result-card">
          <div class="result-top">
            <div>
              <div class="result-code">${escapeHtml(code)}</div>
              <div class="section-label result-meta">${escapeHtml(meta)}</div>
            </div>
            <span class="badge ${type.toLowerCase()}">${type}</span>
          </div>
          <div class="result-grid">
            <section class="result-section primary-section">
              <div class="section-label">Operator Cause</div>
              <div class="section-text">${escapeHtml(record.operator_cause || '-')}</div>
            </section>
            <section class="result-section primary-section">
              <div class="section-label">Operator Recovery</div>
              <div class="section-text">${escapeHtml(record.operator_recovery || '-')}</div>
            </section>
            <section class="result-section">
              <div class="section-label">Service Cause</div>
              <div class="section-text">${escapeHtml(record.service_cause || '-')}</div>
            </section>
            <section class="result-section">
              <div class="section-label">Service</div>
              <div class="section-text">${escapeHtml(record.service_recovery || '-')}</div>
            </section>
            <section class="result-section full-span">
              <div class="section-label">Service Recovery All</div>
              <div class="section-text">${escapeHtml(serviceRecovery || '-')}</div>
            </section>
            <section class="result-section full-span">
              <div class="section-label">Errguid Record IDs</div>
              <div class="section-text">${escapeHtml(record.errguid_record_ids || '-')}</div>
            </section>
          </div>
        </article>
      `;
    }

    function renderEmpty(message) {
      resultsEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16"></path>
              <path d="M4 12h10"></path>
              <path d="M4 17h7"></path>
              <path d="M17 14l3 3"></path>
              <circle cx="16" cy="13" r="3"></circle>
            </svg>
          </div>
          <div>${escapeHtml(message)}</div>
        </div>
      `;
    }

    async function search() {
      const term = normalizeQuery(queryInput.value);
      if (!term) {
        statusEl.textContent = 'Enter an error code to begin.';
        renderEmpty('Enter an error code to begin.');
        return;
      }

      searchButton.disabled = true;
      searchButton.setAttribute('aria-label', 'Searching');
      statusEl.textContent = 'Searching...';

      try {
        const termIsCodeLike = isCodeLike(term);
        let codeMatches = [];

        if (termIsCodeLike) {
          try {
            codeMatches = await queryCodeMatches(term);
          } catch (error) {
            if (!isMissingIndexError(error)) throw error;
            configWarning.style.display = 'block';
            configWarning.textContent = 'Firebase index belum dipasang. Search tetap berjalan dengan fallback data penuh.';
          }
        }

        const keywordMatches = (!termIsCodeLike || codeMatches.length === 0) ? await queryKeywordMatches(term) : [];
        const rows = sortRecords(term, uniqueRecords(codeMatches.concat(keywordMatches))).slice(0, 200);

        searchButton.disabled = false;
        searchButton.setAttribute('aria-label', 'Search');
        statusEl.textContent = `${rows.length} result(s)${rows.length === 200 ? ' (showing first 200)' : ''}`;
        resultsEl.innerHTML = rows.length ? rows.map(card).join('') : '';
        if (!rows.length) renderEmpty('No matching error code or keyword.');
      } catch (error) {
        console.error(error);
        searchButton.disabled = false;
        searchButton.setAttribute('aria-label', 'Search');
        statusEl.textContent = 'Search failed.';
        renderEmpty(error.message || 'Gagal mengambil data dari Firebase.');
      }
    }

    errorCodesRef.limitToFirst(1).once('value')
      .then((snapshot) => {
        if (!snapshot.exists()) {
          configWarning.style.display = 'block';
        }
      })
      .catch((error) => {
        console.error(error);
        configWarning.style.display = 'block';
        statusEl.textContent = 'Gagal koneksi Firebase.';
      });

    function clearSearch() {
      queryInput.value = '';
      statusEl.textContent = 'Enter an error code to begin.';
      renderEmpty('Enter an error code to begin.');
      queryInput.focus();
    }

    searchButton.addEventListener('click', search);
    clearButton.addEventListener('click', clearSearch);
    queryInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') search();
    });
  </script>
</body>

</html>
